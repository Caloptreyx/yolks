name: build java
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths:
      - java/**
      - .github/workflows/java.yml
  pull_request:
    paths:
      - java/**
      - .github/workflows/java.yml
permissions:
  contents: read
  packages: write
jobs:
  push:
    name: "java:${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: "8", java: "8", file: ./java/Dockerfile }
          - { tag: "11", java: "11", file: ./java/Dockerfile }
          - { tag: "17", java: "17", file: ./java/Dockerfile }
          - { tag: "21", java: "21", file: ./java/Dockerfile }
          - { tag: "25", java: "25", file: ./java/Dockerfile }
          - { tag: graalvm, java: "25", file: ./java/graalvm/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./java
          file: ${{ matrix.file }}
          build-args: JAVA_VERSION=${{ matrix.java }}
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/caloptreyx/java:${{ matrix.tag }}
